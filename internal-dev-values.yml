            env:
              HOME: /workspace/
            gpuResourceType: "nvidia.com/gpu"
            resources:
              limits:
                memory: 64Gi
              # gpu: 2  # 30B only; no node has 2 free GPUs -> pod stayed Pending
                gpu: 1
                cpu: 8000m
              requests:
                memory: 64Gi
                cpu: 4000m
              # gpu: 2
                gpu: 1
            ports:
              - name: http
                containerPort: 5000
                protocol: TCP
            livenessProbe:
              initialDelaySeconds: 300
              periodSeconds: 60
              type: httpGet
              path: /health
              port: 5000
              timeoutSeconds: 60
              failureThreshold: 10
            readinessProbe:
              type: httpGet
              path: /health
              port: 5000
              initialDelaySeconds: 300
              timeoutSeconds: 20
              periodSeconds: 120
              failureThreshold: 100
            command: ["python3"]
            args:
              - "-m"
              - "vllm.entrypoints.openai.api_server"
              - "--port"
              - "5000"
              - "--host"
              - "0.0.0.0"
              - "--download-dir"
              - "/workspace/.cache/huggingface/hub"
              - "--model"
              - "Qwen/Qwen3-0.6B"
              - "--max-num-seqs"
              - "128"
              - "--tensor-parallel-size"
            # - "2"  # must equal the GPU count above
              - "1"
              - "--data-parallel-size"
              - "1"
              - "--gpu-memory-utilization"
              - "0.95"
              - "--enable-auto-tool-choice"
              - "--tool-call-parser"
              - "hermes"
              - "--enable-chunked-prefill"
              - "--max-num-batched-tokens"
              - "2048"
              - "--dtype"
              - "auto"
              - "--seed"
              - "1234"
              - "--trust-remote-code"

  service:
    # DISABLED with the llama-3-3-70b deployment above
    # llama-3-3-70b:

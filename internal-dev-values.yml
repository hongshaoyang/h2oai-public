    minio: false
  config:
    datastore: 's3://minio.minio.svc:9000/h2oai-api-v2?region=local&disableTLS=true'
    workflowNamespaces:
      - mlapi-v2
    argo_instance_id: "mlapi-v2"

  secret:
    aws:
      lookup: true
      existingName: 'h2oai-mlapi-minio-auth'
    database:
      lookup: true
      existingName: 'h2oai-mlapi-database'
      existingKeys:
        dsn: dsn

documentai:
  dependencyCheck:
    keycloak: false
    postgresql: false
  config:
    api:
      extraEnv:
        S3_ENDPOINT_URL: 'http://minio.minio.svc:9000'
        AWS_DEFAULT_REGION: local
      s3:
        documents:
          endpointUrl: 'http://minio.minio.svc:9000'
          bucket: h2oai-api-v2
      mlapi:
        # explicit for mlapi-v2
        url: http://h2oai-mlapi-http.mlapi-v2.svc.cluster.local/v1alpha
      #   urlPublic: https://ml-api-v2.staging.ts-h2o.deltasigma.com
      # prevent scorer pod from seeing GPU - configmap documentai-api-config
      publish:
        scorer:
          environment: |
            - name: NVIDIA_VISIBLE_DEVICES
              value: "void"
            - name: CUDA_VISIBLE_DEVICES
              value: ""

  secret:
    api-database:
      lookup: true
      existingName: 'h2oai-documentai-database'
      existingKeys:
        dsn: dsn
    api-aws:
      lookup: true
      existingName: 'h2oai-documentai-minio-auth'
    api-pipeline-aws:
      lookup: true
      existingName: 'h2oai-documentai-minio-auth'



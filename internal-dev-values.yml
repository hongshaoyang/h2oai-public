  deployment:
## This strategyType was not in staging but tested in `vllm upgrade` to apply
    agent-shared:
      strategyType: RollingUpdate
    agent-isolated:
      strategyType: RollingUpdate
    function:
      strategyType: RollingUpdate

    # Image for ALL new-style (config.vllm matrix) pods -> vLLM 0.19.
    # useModelHub is already set here by the umbrella chart, so overriding
    # only the image is safe (maps merge).
    vllm:
      podSpec:
        containers:
          vllm:
            image:
              # repository: h2oai-h2ogpt-internalvllm
              # tag: v0.2.1-2156
              repository: "thirdparty-chainguard-vllmopenai"
              tag: "v0.19-20260515"


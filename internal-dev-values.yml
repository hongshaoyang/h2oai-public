global:
  # rootChartName must be the same as the release name
  rootChartName: h2oai
  cloudProtocol: https
  cloudHost: 10.18.64.250.nip.io
  adminPassword: adminadminadmin
  imageRegistry: 008947002919.dkr.ecr.us-east-1.amazonaws.com
  oidc:
    keycloakRealm: hac

  ingressEnabled: true
  ingressClassName: nginx
  createNamespace: false

  securityContext:
    pod:
      preferGlobal: true
    container:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

  # Set chart to use the deprecated modelshub
  # modelHub:
  #   component: modelshub

  components:
  # Phase 1: GenAI Stack + Phase 4: Migrate H2OGPT to ModelHub
    redis:
      enabled: true
      namespace: h2ogpte
    # Phase 4: Migration to ModelHub
    modelshub:
      enabled: false
      namespace: modelshub
    h2ogpt:
      enabled: true
      namespace: h2ogpt
    h2ogpte:
      enabled: true
      namespace: h2ogpte
    evalstudio:
      enabled: true
      namespace: evalstudio

  # Phase 2: Keycloak Migration
    keycloak:
      enabled: true
      namespace: keycloak-v2
      subdomains:
        public: auth-v2

  # Phase 3: Enabling of telemetry, authz, discovery services 
    appstore:
      enabled: true
      namespace: appstore
      subdomains:
        public: appstore-v2
    clouddiscovery:
      enabled: true
      namespace: discovery-v2     
    authz:
      enabled: true
      namespace: authz-v2
      subdomains:
        public: authz-gateway-v2
    telemetry:
      enabled: true
      namespace: telemetry-v2
      subdomains:
        public: telemetry-v2

    # Phase 4: Migration to ModelHub
    drive:
      enabled: true
      namespace: drive-v2
      subdomains:
        sts: sts-v2
        user-drive: user-drive-v2
        workspace-drive: workspace-drive-v2
    modelhub:
      enabled: true
      namespace: modelhub-v2
      subdomains:
        public: modelhub-v2

    # Phase 5: AIEM
    aiem:
      enabled: true
      namespace: aiem-v2
      subdomains:
        public: enginemanager-v2
    gatewayapi:
      enabled: true
      namespace: gateway-v2

    #Phase 6 MLOps
    rabbitmq:
      enabled: true
      namespace: rabbitmq-v2
    mlops:
      enabled: true
      namespace: mlops-v2
      subdomains:
        web: mlops-v2
        apiGateway: mlops-api-v2
        deploymentEnvironment: model-v2

    # Phase 7 - DocumentAI
    kafka:
      enabled: true
      namespace: kafka-v2
    argoworkflows:
      enabled: true
      namespace: argoworkflows-v2
    mlapi:
      enabled: true
      namespace: mlapi-v2
      subdomains:
        public: ml-api-v2
    documentai:
      enabled: true
      namespace: document-ai-v2
      subdomains:
        apiServer: document-ai-backend-v2
        uiViewer: document-ai-viewer-v2
        uiPublisher: document-ai-v2


# Phase 8 WaveApps
    applabelgeniegpu:
      enabled: true
      namespace: appstore
    applabelgeniecpu:
      enabled: true
      namespace: appstore
    apphydrogentorch:
      enabled: true
      namespace: appstore
    appdriveui:
      enabled: true
      namespace: appstore
    # Internal Dev install manually due to PVC size creation limit (default need 2Ti)
    appllmstudio:
      enabled: false
      namespace: appstore

  # Disabled not installing in UH 1.2.0
    nginx:
      enabled: false
      namespace: nginx
    ambassador:
      enabled: false
      namespace: mlops
    aiemambassador:
      enabled: false
      namespace: aiem
    postgresql:
      enabled: false
    minio:
      enabled: false
      namespace: minio
    influxdb:
      enabled: false
      namespace: default
    steam:
      enabled: false
      namespace: steam
    llmstudio:
      enabled: false
      namespace: appstore
    llmdatastudio:
      enabled: false
      namespace: appstore
    keda:
      enabled: false


h2ogpte:
  dependencyCheck:
    keycloak: false
    postgresql: false
    minio: false
    redis: false
  
  subdomains:
    public: h2ogpte
  config:
    usage:
      maxLlmCostPerUserPer24h: 1000

    #Phase 1
    objectStorage:
      type: minio                     # use 'minio' for direct MinIO access
      secureConnectors:
        enabled: false                # disable — not using securestore-managed connectors
      secretManager:
        enabled: false  

    # config.mux
    mux:
      adminMode: "oidc"
      rolesClaim: "groups"
      adminRole: "admin"
      # logoUrl: "https://ts-h2opure.<DOMAIN>/h2o-public/h2ogpte-favicon.svg"
      # chatLogoUrl: "https://ts-h2opure.<DOMAIN>/h2o-public/h2ogpte.png"
      primaryColor: "#334F4E"
      chatName: "SuperAI"
      titleText: "SuperAI"
      greeting: "Hello"
      resources:
        limits:
          memory: 8Gi
        requests:
          memory: 4Gi
          cpu: 4000m
      storage:
        size: 32Gi
        useEphemeral: true
      evalStudio:
        enabled: true # TODO check if need grpcAddress and uiAddress
        # grpcAddress: ""
        # uiAddress: ""

    # config.vex
    vex:
      resources:
        limits:
          memory: 32Gi
          cpu: 4000m
        requests:
          memory: 32Gi
          cpu: 2000m
      storage:
        useEphemeral: false

    # config.crawl
    crawl:
      resources:
        limits:
          memory: 32Gi
          cpu: 4000m
          gpu: 0
        requests:
          memory: 32Gi
          cpu: 4000m
          gpu: 0
      storage:
        size: 32Gi
        useEphemeral: true
      coreEncoderDevice: cpu

    # config.core
    core:
      resources:
        limits:
          memory: 32Gi
          cpu: 4000m
          gpu: 0
        requests:
          memory: 16Gi
          cpu: 4000m
          gpu: 0
      storage:
        size: 32Gi
        useEphemeral: true

      productName: 555-internal-dev
      companyName: company 555
      workers: 4
      defaultAgentTools: '["python", "shell", "ask_question_about_documents.py", "mermaid_renderer.py", "convert_document_to_text.py"]'

    # config.chat
    chat:
      resources:
        limits:
          memory: 12Gi
          cpu: 4000m
          gpu: 0
        requests:
          memory: 12Gi
          cpu: 4000m
          gpu: 0
      storage:
        size: 32Gi
        useEphemeral: true

    # config.models
    models:
      # -- Resources requests and limits for the models container. Must have GPUs in production, otherwise extremely slow.
      resources:
        requests:
          cpu: 4000m
          memory: 32Gi
          gpu: 1
        limits:
          memory: 32Gi
          gpu: 1
        gpuResourceName: nvidia.com/gpu


      # models autoscaling
      autoscaling:
        enabled: false
        minReplicas: 3
        maxReplicas: 4
        scaleUpPods: 1
        scaleDownPods: 1
        metricsEnabled: true

    license:
      existingSecret: h2oai-h2ogpte-license

  secret:
    oidc:
      lookup: false
      existingName: 'h2oai-h2ogpte-oidc'
    db-trusted:
      # lookup: false # TODO check if h2ogpte.secret.foo.lookup needed
      existingName: 'h2oai-h2ogpte-trusted-database'
      existingKeys:
        dsn: dsn
    db-untrusted:
      existingName: 'h2oai-h2ogpte-untrusted-database'
      existingKeys:
        dsn: dsn
    db-admin:
      existingName: 'h2oai-h2ogpte-admin-database'
      existingKeys:
        dsn: dsn
    minio:
      lookup: false
      existingName: 'h2oai-h2ogpte-minio-auth'
    shared-minio:
      lookup: false
      existingName: 'h2oai-h2ogpte-shared-minio-auth'

  deployment:
    chat:
      replicas: 1
      strategyType: RollingUpdate
      podSpec:
        containers:
          chat:
            envFrom:
            - configMapRef:
                name: core-extra-conf
            - configMapRef:
                name: chat-config
            - secretRef:
                name: "h2ogpt-secret"
            - secretRef:
                enabled: "{{ and .Values.config.agentSecrets true }}"
                name: agent-builtin-secret

    core:
      strategyType: RollingUpdate
      replicas: 1
      podSpec:
        containers:
          core:
            envFrom:
            - configMapRef:
                name: core-extra-conf
            - configMapRef:
                name: core-config
            - secretRef:
                name: "h2ogpt-secret"
            - secretRef:
                enabled: "{{ and .Values.config.agentSecrets true }}"
                name: agent-builtin-secret

    crawl:
      strategyType: RollingUpdate
      replicas: 1
    mux:
      strategyType: RollingUpdate
      replicas: 1
      podSpec:
        containers:
          mux:
            envFrom:
            - configMapRef:
                name: mux-config
            # - configMapRef:
            #     name: mux-extra-cm
    models:
      strategyType: RollingUpdate

  pvc:
    vex-pvc:
      resources:
        requestsStorage: 1000Gi
        limitsStorage: 32Gi

  configmap:
    core-extra-conf:
      data:
        # tracker 181 cost constraints
        h2ogpte_CORE_DEFAULT_COST_CONTROLS: '{"max_cost": 0.5, "max_cost_per_million_tokens": 75, "model": ["Qwen/Qwen2.5-0.5B-Instruct"], "willingness_to_pay": 0.6, "willingness_to_wait": 10 }'
        # tracker xxx vision mode
        h2ogpte_CORE_DEFAULT_VISION_MODE: 'off'
    # mux-extra-cm:
    #   data:
    #     h2ogpte_MUX_TELEMETRY_ENABLED: "true"
    #     h2ogpte_MUX_TELEMETRY_ADDRESS: "mha-internal-dev-dev-telemetry-service.telemetry.svc.cluster.local:80"


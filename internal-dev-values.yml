modelshub:
  dependencyCheck:
    minio: false

  # UH 3.0.0 needs v0.0.18 to functions
  image:
    tag: v0.0.18

  minio:
    readTimeout: 30
    connectionTimeout: 30
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      memory: "4Gi"

  configmap:
    config:
      data:
        FLASK_MINIO_API_HOST: 'minio.minio.svc:9000'
        FLASK_MINIO_BUCKET_NAME: "h2o-models-hub"

  securityContext:
    container:
      preferGlobal: false
      runAsNonRoot: true
      runAsUser: "1000"
      allowPrivilegeEscalation: false
    #   privileged: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

# Phase 2
keycloak:
  namespaceOverride: keycloak-v2
  dependencyCheck:
    postgresql: false       # We use external DB, not the bundled one
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi           # Default 768Mi causes OOMKill
  postgresql:
    enabled: false           # Disable bundled PostgreSQL
  externalDatabase:
    host: postgres16.postgres-db.svc.cluster.local
    port: 5432
    database: keycloak_v2
    existingSecret: h2oai-keycloak-database
    existingSecretUserKey: username
    existingSecretPasswordKey: password
  
  # config for ssl
  trustedCertsExistingSecret: ""
  extraStartupArgs: "--features=fips --https-key-store-type=bcfks --verbose"
  extraEnvVars:
    - name: ADFS_TRUSTSTORE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: spi-password
          key: spi-truststore-password
    - name: JDK_JAVA_OPTIONS
      value: >-
        -Djavax.net.ssl.trustStore=/opt/iamguarded/keycloak/adfs/truststore.bcfks
        -Djavax.net.ssl.trustStorePassword=$(ADFS_TRUSTSTORE_PASSWORD)
  
  # Mount Kubernetes secret (truststore)
  extraVolumes:
    - name: adfs-truststore
      secret:
        secretName: adfs-truststore

  extraVolumeMounts:
    - name: adfs-truststore
      mountPath: /opt/iamguarded/keycloak/adfs
      readOnly: true


# Phase 3 configuration
authz:
  namespaceOverride: authz-v2
  dependencyCheck:
    keycloak: false
    postgresql: false
  config:
    gateway:
      enabled: true
      logLevel: debug
    policyserver:
      logLevel: debug
    workspaceserver:
      logLevel: debug
    
    userserver:
      keycloak:
        credentials:
          clientID: hac-authz
    serviceAuth:
      issuerURL: "https://mha-internal-dev-bucket-008947002919-us-east-1-an.s3.us-east-1.amazonaws.com/eks/oidc"
      useKubernetesHTTPClient: false

  secret:
    policyserver-database:
      existingName: 'h2oai-authz-policyserver-database'
      existingKeys:
        dsn: dsn
    workspaceserver-database:
      existingName: 'h2oai-authz-workspaceserver-database'
      existingKeys:
        dsn: dsn
    keycloak:
      existingName: 'h2oai-authz-keycloak'

telemetry:
  namespaceOverride: telemetry-v2
  dependencyCheck:
    postgresql: false
  config:
    serviceAuth:
      issuerURL: "https://mha-internal-dev-bucket-008947002919-us-east-1-an.s3.us-east-1.amazonaws.com/eks/oidc"
      useKubernetesHTTPClient: false
  secret:
    dsn:
      lookup: true
      existingName: 'h2oai-telemetry-database'
      existingKeys:
        dsn: dsn

clouddiscovery:
  namespaceOverride: discovery-v2
  deployment:
    server:
      replicas: 1
  config:
    registry:
      kubernetes:
        excludeNamespaceRegexp: "^(mlops|steam|telemetry|discovery|keycloak)$"
  ingress:
    service:
      enabled: true
      rules:
        main-rule:
          subdomain: appstore-v2
          paths:
            service-path:
              path: "/.ai.h2o.cloud.discovery/"
              pathType: ImplementationSpecific
              serviceName: public
              portNumber: 9610

appstore:
  namespaceOverride: appstore
  dependencyCheck:
    keycloak: false
    postgresql: false
    clouddiscovery: true
  config:
    server:
      # added on 2026-06-04 by PCSS to conduct FAT on Staging; create alias issue
      disableSubdomainRouting: false

      clientID: hac-appstore
      cliClientID: hac-appstore-public
      waveClientID: hac-appstore-wave
      platformClientID: hac-platform-public
      storePath: 's3://appstore-bucket-v2/store?endpoint=http://minio.minio.svc:9000&region=local&use_path_style=true'
      
      #Launch Profles LG, HT and LLM Studio
      launchProfiles: 
        gpu-lg:
          description: "GPU Label Genie"
          memoryLimit: 16Gi
          memoryReservation: 16Gi
          cpuLimit: 2
          cpuReservation: 2
          gpuCount: 1
        cpu-lg:
          description: "CPU Label Genie"
          memoryLimit: 16Gi
          memoryReservation: 16Gi
          cpuLimit: 4
          cpuReservation: 2
          #gpuResource: nvidia.com/mig-7g.80gb
        gpu-ht:
          description: "GPU Hydrogen Torch Profile"
          memoryLimit: 48Gi
          memoryReservation: 32Gi
          cpuLimit: 2
          cpuReservation: 2
          gpuCount: 1
        gpu-ls:
          description: "GPU LLM Studio"
          memoryLimit: 64Gi
          memoryReservation: 32Gi
          cpuLimit: 4
          cpuReservation: 4
          gpuCount: 1
  
  ingress:
    ingress:
      rules:
        main-rule:
          paths:
            discovery-path:
              enabled: false

  secret:
    secrets:
      lookup: true
      existingName: 'h2oai-appstore-secrets'
    dsn:
      lookup: true
      existingName: 'h2oai-appstore-database'
      existingKeys:
        dsn: dsn
    minio-auth:
      lookup: true
      existingName: 'h2oai-appstore-minio-auth'



# Phase 1
redis:
  namespaceOverride: h2ogpte
  master:
    persistence:
      size: 200Gi

h2ogpt:
  config:
    commonConfig:
      verbose: "true"
    llm:
      resources:
        limits:
          memory: 16Gi
        requests:
          memory: 4Gi
          cpu: 100m
      overrideConfig:
        langchain_mode: "UserData"
      env:
        NVIDIA_VISIBLE_DEVICES: none
        DISABLE_OPENAI_AUTO_MODEL_NAME: 1
        H2OGPT_VALIDATE_CLIENTS: "false" # MHA specific issue tracker n

      # OLD-STYLE vLLM (0.8.5 / h2oai-h2ogpt-internalvllm) — must be declared here by hand.
      # NEW-STYLE models under config.vllm are appended to model_lock automatically
      # by the chart (see charts/h2oai-h2ogpt/templates/_helpers.tpl "h2ogpt.modelLock").
      externalLLM:
        modelLock:
        # added on 2026-06-04 by PCSS to conduct FAT on Staging; based on umbrella-1.2.0-values_masked.yaml from Prod
        - inference_server     : vllm_chat:h2oai-h2ogpt-qwen3-coder:5000:/v1 #kubernets service name
          base_model           : Qwen/Qwen3-0.6B
          display_name         : Qwen/Qwen3-0.6B
          tokenizer_base_model : tiktoken
          max_seq_len          : 32768
        #  max_output_seq_len   : 4096 # disable, modifiable in UI
          images_num_max       : -2
    function:
      config:
        enable_stt: false
        stt_model: ""
        enable_transcriptions: false
      resources:
        requests:
          gpu: 0
          memory: 8Gi
        limits:
          gpu: 0
          memory: 32Gi

    agentShared:
      env:
        DISABLE_OPENAI_AUTO_MODEL_NAME: 1
        H2OGPT_VALIDATE_CLIENTS: "false"
    agentIsolated:
      env:
        DISABLE_OPENAI_AUTO_MODEL_NAME: 1
        H2OGPT_VALIDATE_CLIENTS: "false"

    # ---------------------------------------------------------------------
    # NEW-STYLE vLLM declaration (0.19 / thirdparty-chainguard-vllmopenai).
    # The chart drives these off `.Values.config.vllm` (matrix), so this MUST
    # live under h2ogpt.config -- NOT under h2ogpt.mount. Renders as
    # deployment + service + ephemeral volume named h2oai-h2ogpt-vllm-<name>,
    # and is appended to H2OGPT_MODEL_LOCK automatically.
    # Image comes from h2ogpt.deployment.vllm.podSpec below.
    # ---------------------------------------------------------------------
    vllm:
      qwen2505b:
        enabled: true
        pdb:
          enabled: false
        env:
          USER: "h2ogpt"
          VLLM_NO_USAGE_STATS: "1"
          DO_NOT_TRACK: "1"
          HF_HUB_ENABLE_HF_TRANSFER: "0"
          VLLM_LOGGING_LEVEL: "DEBUG"
          TRITON_CACHE_DIR: "/workspace/.cache/.triton"
        model: Qwen/Qwen2.5-0.5B-Instruct
        resources:
          limits:
            cpu: 8000m
            memory: 32Gi
            gpu: 1
          requests:
            cpu: 4000m
            memory: 32Gi
            gpu: 1
        storage:
          size: 512Gi
          useEphemeral: true
        # NOTE: the chart template already emits --port/--host/--download-dir/--model.
        # Only additional args belong here (they are appended as extraArgs).
        containerArgs:
          - "--max-num-seqs"
          - "16"
          - "--tensor-parallel-size"
          - "1"
          - "--gpu-memory-utilization"
          - "0.95"
          - "--max-model-len"
          - "32768"
          - "--dtype"
          - "auto"
          - "--seed"
          - "1234"
          - --trust-remote-code
          - --enable-prefix-caching
          - --enable-chunked-prefill



